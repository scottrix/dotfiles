# ported from Xresources/Xdefaults (uxterm green on black, Terminess 9)
[main]
font=Terminess Nerd Font:size=9
term=xterm-256color

[scrollback]
lines=1000

[colors-dark]
foreground=00ff00
background=000000

[key-bindings]
font-increase=Control+plus Control+equal Control+KP_Add
font-decrease=Control+minus Control+KP_Subtract
